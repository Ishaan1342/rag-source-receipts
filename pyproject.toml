[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-source-receipts"
version = "0.1.1"
description = "Portable content receipts and re-embedding decisions for RAG ingestion"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{name = "Ishaan Gill"}]
keywords = ["agents", "testing", "open-source"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.13"]

[tool.setuptools.packages.find]
include = ["source_receipts*"]

[project.scripts]
rag-source-receipts = "source_receipts.__main__:main"
